<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <title>Battery passport data model: Annex XIII access groups</title>
  <rect width="960" height="470" rx="16" fill="#f3f5f8"/>
  <text x="32" y="42" font-size="13" font-weight="700" fill="#5d6879" letter-spacing="1.5">DATA MODEL · REGULATION (EU) 2023/1542 ANNEX XIII</text>
  <text x="32" y="68" font-size="15" fill="#0d1420">10 sections · 86 attributes · every attribute carries a legal reference, a provenance tag and its sources</text>

  <!-- Public -->
  <rect x="32" y="92" width="430" height="300" rx="12" fill="#fff" stroke="#e2e6ec"/>
  <rect x="32" y="92" width="430" height="5" rx="2" fill="#0e7a4f"/>
  <text x="52" y="128" font-size="17" font-weight="700" fill="#0d1420">Public</text>
  <text x="52" y="149" font-size="12.5" fill="#5d6879">Anyone who scans the QR code · Annex XIII 1</text>
  <g font-size="13.5" fill="#0d1420">
    <rect x="52" y="166" width="390" height="30" rx="7" fill="#f7f9fb" stroke="#e2e6ec"/><text x="66" y="186">Identification &amp; labelling</text><text x="428" y="186" text-anchor="end" fill="#5d6879" font-size="12">Annex VI A</text>
    <rect x="52" y="202" width="390" height="30" rx="7" fill="#f7f9fb" stroke="#e2e6ec"/><text x="66" y="222">Carbon footprint</text><text x="428" y="222" text-anchor="end" fill="#5d6879" font-size="12">Art. 7</text>
    <rect x="52" y="238" width="390" height="30" rx="7" fill="#f7f9fb" stroke="#e2e6ec"/><text x="66" y="258">Supply chain due diligence</text><text x="428" y="258" text-anchor="end" fill="#5d6879" font-size="12">Art. 52</text>
    <rect x="52" y="274" width="390" height="30" rx="7" fill="#f7f9fb" stroke="#e2e6ec"/><text x="66" y="294">Recycled &amp; renewable content</text><text x="428" y="294" text-anchor="end" fill="#5d6879" font-size="12">Art. 8</text>
    <rect x="52" y="310" width="390" height="30" rx="7" fill="#f7f9fb" stroke="#e2e6ec"/><text x="66" y="330">Performance &amp; durability</text><text x="428" y="330" text-anchor="end" fill="#5d6879" font-size="12">Annex IV</text>
    <rect x="52" y="346" width="390" height="30" rx="7" fill="#f7f9fb" stroke="#e2e6ec"/><text x="66" y="366">End of life &amp; collection</text><text x="428" y="366" text-anchor="end" fill="#5d6879" font-size="12">Art. 74</text>
  </g>

  <!-- Legitimate interest -->
  <rect x="482" y="92" width="446" height="186" rx="12" fill="#fff" stroke="#e2e6ec"/>
  <rect x="482" y="92" width="446" height="5" rx="2" fill="#9a5b00"/>
  <text x="502" y="128" font-size="17" font-weight="700" fill="#0d1420">Legitimate interest</text>
  <text x="502" y="149" font-size="12.5" fill="#5d6879">Repairers, second-life operators, recyclers · Annex XIII 2, 4</text>
  <g font-size="13.5" fill="#0d1420">
    <rect x="502" y="166" width="406" height="30" rx="7" fill="#f7f9fb" stroke="#e2e6ec"/><text x="516" y="186">Detailed composition</text><text x="894" y="186" text-anchor="end" fill="#5d6879" font-size="12">2(a)</text>
    <rect x="502" y="202" width="406" height="30" rx="7" fill="#f7f9fb" stroke="#e2e6ec"/><text x="516" y="222">Repair &amp; dismantling</text><text x="894" y="222" text-anchor="end" fill="#5d6879" font-size="12">2(b)–(d)</text>
    <rect x="502" y="238" width="406" height="30" rx="7" fill="#eaf0fd" stroke="#c9d8fa"/><text x="516" y="258">State of health &amp; status (dynamic BMS data)</text><text x="894" y="258" text-anchor="end" fill="#1557d8" font-size="12">Art. 14</text>
  </g>

  <!-- Authorities -->
  <rect x="482" y="292" width="446" height="100" rx="12" fill="#fff" stroke="#e2e6ec"/>
  <rect x="482" y="292" width="446" height="5" rx="2" fill="#b42318"/>
  <text x="502" y="328" font-size="17" font-weight="700" fill="#0d1420">Authorities</text>
  <text x="502" y="349" font-size="12.5" fill="#5d6879">Notified bodies, market surveillance, Commission · Annex XIII 3</text>
  <g font-size="13.5" fill="#0d1420">
    <rect x="502" y="356" width="406" height="28" rx="7" fill="#f7f9fb" stroke="#e2e6ec"/><text x="516" y="375">Conformity &amp; test reports</text>
  </g>

  <!-- provenance -->
  <text x="32" y="424" font-size="12" font-weight="700" fill="#5d6879" letter-spacing="1.2">PROVENANCE TAGS</text>
  <g font-size="12.5" fill="#2b3545">
    <circle cx="38" cy="446" r="5" fill="#1557d8"/><text x="50" y="450">Official</text>
    <circle cx="124" cy="446" r="5" fill="#6b4fd8"/><text x="136" y="450">Derived</text>
    <circle cx="210" cy="446" r="5" fill="#0f766e"/><text x="222" y="450">Regulation</text>
    <circle cx="310" cy="446" r="5" fill="#b7791f"/><text x="322" y="450">Literature</text>
    <circle cx="404" cy="446" r="5" fill="#d0622a"/><text x="416" y="450">Estimated</text>
    <circle cx="496" cy="446" r="5" fill="#7a8698"/><text x="508" y="450">Simulated</text>
    <circle cx="590" cy="446" r="5" fill="#c9372c"/><text x="602" y="450">Not disclosed (gap, value null)</text>
  </g>
</svg>
