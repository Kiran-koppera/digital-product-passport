<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <title>Architecture: QR scan to passport, and the build pipeline</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5d6879"/></marker>
  </defs>
  <rect width="960" height="440" rx="16" fill="#f3f5f8"/>
  <text x="32" y="40" font-size="13" font-weight="700" fill="#5d6879" letter-spacing="1.5">RUNTIME · WHAT HAPPENS WHEN THE QR CODE IS SCANNED</text>

  <g font-size="13" fill="#0d1420">
    <rect x="32" y="60" width="160" height="96" rx="12" fill="#fff" stroke="#e2e6ec"/>
    <text x="48" y="88" font-weight="700" font-size="14">Battery label</text>
    <text x="48" y="110" fill="#5d6879">Static QR code</text>
    <text x="48" y="128" fill="#5d6879">with the final URL</text>
    <text x="48" y="146" fill="#5d6879">(Art. 13, Art. 77)</text>

    <rect x="232" y="60" width="160" height="96" rx="12" fill="#fff" stroke="#e2e6ec"/>
    <text x="248" y="88" font-weight="700" font-size="14">Phone camera</text>
    <text x="248" y="110" fill="#5d6879">No app, no account,</text>
    <text x="248" y="128" fill="#5d6879">no redirect service</text>

    <rect x="432" y="60" width="200" height="96" rx="12" fill="#0b1220"/>
    <text x="448" y="88" font-weight="700" font-size="14" fill="#fff">passport.html</text>
    <text x="448" y="110" fill="#9fb0c8">?id=vw-id-polo-lfp-37</text>
    <text x="448" y="128" fill="#9fb0c8">vanilla JS viewer on</text>
    <text x="448" y="146" fill="#9fb0c8">GitHub Pages (HTTPS)</text>

    <rect x="672" y="60" width="256" height="96" rx="12" fill="#fff" stroke="#e2e6ec"/>
    <text x="688" y="88" font-weight="700" font-size="14">data/passports/&lt;id&gt;.json</text>
    <text x="688" y="110" fill="#5d6879">86 attributes, each with legal</text>
    <text x="688" y="128" fill="#5d6879">reference, provenance and</text>
    <text x="688" y="146" fill="#5d6879">cited sources</text>
  </g>
  <g stroke="#5d6879" stroke-width="1.6" marker-end="url(#a)">
    <line x1="194" y1="108" x2="228" y2="108"/>
    <line x1="394" y1="108" x2="428" y2="108"/>
    <line x1="668" y1="108" x2="636" y2="108"/>
  </g>
  <text x="652" y="100" font-size="11" fill="#5d6879" text-anchor="middle">fetch</text>

  <g font-size="12.5">
    <rect x="432" y="176" width="160" height="70" rx="10" fill="#e3f4ec"/>
    <text x="446" y="200" font-weight="700" fill="#0e7a4f">Public</text>
    <text x="446" y="220" fill="#2b3545">6 sections, shown</text>
    <text x="446" y="236" fill="#2b3545">to everyone</text>
    <rect x="602" y="176" width="160" height="70" rx="10" fill="#fdf2df"/>
    <text x="616" y="200" font-weight="700" fill="#9a5b00">Legitimate interest</text>
    <text x="616" y="220" fill="#2b3545">composition, dismantling,</text>
    <text x="616" y="236" fill="#2b3545">state of health</text>
    <rect x="772" y="176" width="156" height="70" rx="10" fill="#fdecea"/>
    <text x="786" y="200" font-weight="700" fill="#b42318">Authorities</text>
    <text x="786" y="220" fill="#2b3545">conformity and</text>
    <text x="786" y="236" fill="#2b3545">test reports</text>
  </g>
  <path d="M532 158 V172" stroke="#5d6879" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="32" y="200" font-size="12.5" fill="#5d6879">Role switch (demo): a client-side view of the</text>
  <text x="32" y="218" font-size="12.5" fill="#5d6879">Annex XIII access groups. Production needs</text>
  <text x="32" y="236" font-size="12.5" fill="#5d6879">server-side identity; static files are public.</text>

  <line x1="32" y1="276" x2="928" y2="276" stroke="#d3d9e2" stroke-dasharray="4 5"/>
  <text x="32" y="306" font-size="13" font-weight="700" fill="#5d6879" letter-spacing="1.5">BUILD &amp; DEPLOY · GITHUB ACTIONS ON EVERY PUSH</text>
  <g font-size="13" fill="#0d1420">
    <rect x="32" y="326" width="160" height="80" rx="12" fill="#fff" stroke="#e2e6ec"/>
    <text x="48" y="354" font-weight="700">Passport JSON</text><text x="48" y="376" fill="#5d6879">versioned in Git,</text><text x="48" y="394" fill="#5d6879">reviewed as PRs</text>
    <rect x="216" y="326" width="160" height="80" rx="12" fill="#fff" stroke="#e2e6ec"/>
    <text x="232" y="354" font-weight="700">validate_data.py</text><text x="232" y="376" fill="#5d6879">schema + Annex XIII</text><text x="232" y="394" fill="#5d6879">rules + gap report</text>
    <rect x="400" y="326" width="160" height="80" rx="12" fill="#fff" stroke="#e2e6ec"/>
    <text x="416" y="354" font-weight="700">generate_qr.py</text><text x="416" y="376" fill="#5d6879">segno · SVG + PNG</text><text x="416" y="394" fill="#5d6879">level Q</text>
    <rect x="584" y="326" width="160" height="80" rx="12" fill="#fff" stroke="#e2e6ec"/>
    <text x="600" y="354" font-weight="700">verify_qr.py</text><text x="600" y="376" fill="#5d6879">OpenCV decode +</text><text x="600" y="394" fill="#5d6879">Playwright e2e</text>
    <rect x="768" y="326" width="160" height="80" rx="12" fill="#0b1220"/>
    <text x="784" y="354" font-weight="700" fill="#fff">Deploy to Pages</text><text x="784" y="376" fill="#9fb0c8">only if every</text><text x="784" y="394" fill="#9fb0c8">check passes</text>
  </g>
  <g stroke="#5d6879" stroke-width="1.6" marker-end="url(#a)">
    <line x1="194" y1="366" x2="212" y2="366"/><line x1="378" y1="366" x2="396" y2="366"/>
    <line x1="562" y1="366" x2="580" y2="366"/><line x1="746" y1="366" x2="764" y2="366"/>
  </g>
</svg>
