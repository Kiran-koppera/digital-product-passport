<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Labels · Battery Digital Product Passport</title>
  <meta name="description" content="Printable QR labels linking each battery to its Digital Product Passport.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script type="module">
    import { escapeHtml, fetchJSON, initThemeToggle } from "./assets/js/common.js";
    initThemeToggle();
    const BASE = "https://kiran-koppera.github.io/digital-product-passport/";
    const box = document.getElementById("labels");
    try {
      const reg = await fetchJSON("data/passports.json");
      const recs = await Promise.all(reg.passports.map((p) => fetchJSON(`data/passports/${p.id}.json`)));
      box.innerHTML = recs.map((r) => `
        <div class="label">
          <img src="qr/${r.id}.svg" width="120" height="120" alt="QR code for ${escapeHtml(r.productName)}">
          <div>
            <span class="tag">DIGITAL PRODUCT PASSPORT</span>
            <h3>${escapeHtml(r.productName)}</h3>
            <p>${r.uid ? `UID ${escapeHtml(r.uid)}<br>` : ""}${BASE}passport.html?id=${r.id}</p>
          </div>
        </div>`).join("");
    } catch (e) {
      box.innerHTML = `<p class="muted">Could not load labels: ${escapeHtml(e.message)}</p>`;
    }
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="./" aria-label="Battery DPP home">
        <img src="assets/img/favicon.svg" width="28" height="28" alt="">
        <span>Battery DPP</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="./#passports">All passports</a>
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle theme"></button>
      </nav>
    </div>
  </header>
  <main class="wrap" style="padding-top:32px">
    <div class="no-print" style="display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap">
      <div>
        <span class="eyebrow">Print</span>
        <h1 style="font-size:2rem">Battery QR labels</h1>
        <p class="muted" style="max-width:60ch">Print and attach to the battery or its packaging. Codes use error-correction level Q (~25 % damage tolerance);
          print at 20 mm or larger for reliable scanning.</p>
      </div>
      <button class="btn btn-primary" type="button" onclick="window.print()">Print labels</button>
    </div>
    <div class="labels" id="labels"><p class="muted">Loading…</p></div>
  </main>
</body>
</html>
